      keywords_any: [propuesta, pedido, andrés, andres, 3, tres, tés verdes, tes verdes, 99 minutos, confirma, total]
      require_pending: true
      verify_pending_quantity: 3
    - text: "¿ya quedó creado?"
      expected_tool: null
      keywords_any: [aún no, aun no, no he creado, pulsa confirmar, revisa el resumen, confirma]
      require_pending: true
    - text: "sí, confírmalo"
      expected_tool: [confirmar_accion, proponer_pedido]
      keywords_any: [creado, confirmado, andrés, andres]
      verify_db_order:
        cliente: "Andrés Castro"
        ciudad: "Bogotá"
        cantidad: 3

